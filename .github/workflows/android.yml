name: Android validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Security and policy checks
        run: |
          python3 tools/test_release_policy.py
          python3 tools/security_audit.py --ref HEAD
          python3 tools/public_audit.py --ref HEAD
          python3 tools/verify_reflection_content.py
          python3 tools/verify_ui_fonts.py
      - name: Unit tests, release lint, unsigned build
        working-directory: launcher
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Prepare accompanying dependency source
        run: python3 tools/prepare_dependency_sources.py
      - name: Audit packaged assets and accompanying source
        run: python3 tools/public_audit.py --ref HEAD --apk launcher/app/build/outputs/apk/release/app-release-unsigned.apk --sources release-local/dependency-sources/desugar_jdk_libs-2.1.5-source.zip
      - name: Candidate checksum
        run: sha256sum launcher/app/build/outputs/apk/release/app-release-unsigned.apk > SHA256SUMS-UNSIGNED.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-validation-only
          path: |
            launcher/app/build/outputs/apk/release/app-release-unsigned.apk
            SHA256SUMS-UNSIGNED.txt
            release-local/dependency-sources/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-reports
          path: |
            launcher/app/build/reports/
            launcher/app/build/test-results/
          retention-days: 7
